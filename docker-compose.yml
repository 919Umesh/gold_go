version: '3.8'

services:
  # Go Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Server
      PORT: 8080

      # Supabase Configuration
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-anon-key}

      # Workers
      WORKER_COUNT: 5
      QUEUE_SIZE: 100

      # JWT
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}

      # Gold Provider
      GOLD_PROVIDER_URL: ${GOLD_PROVIDER_URL:-http://localhost:9000}

    restart: unless-stopped

    networks:
      - gold-network

networks:
  gold-network:
    driver: bridge

