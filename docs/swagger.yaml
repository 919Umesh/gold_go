basePath: /api/v1
definitions:
  api.CreateTriggerRequest:
    properties:
      company_id:
        type: string
      direction:
        description: above, below
        type: string
      shares_qty:
        type: integer
      trigger_price:
        type: number
    required:
    - company_id
    - direction
    - shares_qty
    - trigger_price
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      message:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 6
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
      role:
        maxLength: 10
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - phone
    - role
    type: object
  auth.UpdateKYCAdmin:
    properties:
      kyc_status:
        enum:
        - pending
        - verified
        - rejected
        - under_review
        type: string
      role:
        enum:
        - user
        - admin
        type: string
    required:
    - kyc_status
    - role
    type: object
  auth.UpdateProfileRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      kyc_status:
        type: string
      phone:
        type: string
      profile_image_url:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  ipo.ApplyIPORequest:
    properties:
      shares_requested:
        type: integer
    required:
    - shares_requested
    type: object
  ipo.CreateCompanyRequest:
    properties:
      name:
        type: string
      sector:
        type: string
      symbol:
        type: string
      total_supply:
        type: integer
    required:
    - name
    - symbol
    - total_supply
    type: object
  ipo.LaunchIPORequest:
    properties:
      close_at:
        type: string
      company_id:
        type: string
      max_per_applicant:
        type: integer
      open_at:
        type: string
      price_per_share:
        type: string
      total_shares:
        type: integer
    required:
    - close_at
    - company_id
    - max_per_applicant
    - open_at
    - price_per_share
    - total_shares
    type: object
  models.CandlestickData:
    properties:
      change_percent:
        type: number
      close:
        type: number
      high:
        type: number
      low:
        type: number
      open:
        type: number
      timestamp:
        type: string
      turnover:
        type: number
      volume:
        type: integer
    type: object
  models.Company:
    properties:
      avg_120_day:
        type: number
      book_value:
        type: number
      created_at:
        type: string
      current_price:
        type: number
      description:
        type: string
      eps:
        type: number
      id:
        type: string
      is_active:
        type: boolean
      listed_date:
        type: string
      market_cap:
        type: number
      name:
        type: string
      pbv:
        type: number
      pe_ratio:
        type: number
      sector:
        type: string
      shares_outstanding:
        type: number
      symbol:
        type: string
      total_supply:
        type: integer
      updated_at:
        type: string
      week_52_high:
        type: number
      week_52_low:
        type: number
      yield_1_year:
        type: number
    type: object
  models.LiveTradingData:
    properties:
      change_percent:
        type: number
      company_id:
        type: string
      company_name:
        type: string
      difference:
        type: number
      high:
        type: number
      last_updated:
        type: string
      low:
        type: number
      ltp:
        type: number
      open:
        type: number
      previous_close:
        type: number
      sector:
        type: string
      symbol:
        type: string
      turnover:
        type: number
      volume:
        type: integer
    type: object
  models.MarketIndex:
    properties:
      advances:
        type: integer
      change:
        type: number
      change_percent:
        type: number
      declines:
        type: integer
      index_value:
        type: number
      previous_close:
        type: number
      timestamp:
        type: string
      total_companies:
        type: integer
      total_market_cap:
        type: number
      total_turnover:
        type: number
      total_volume:
        type: integer
      unchanged:
        type: integer
    type: object
  models.PriceTrigger:
    properties:
      company_id:
        type: string
      created_at:
        type: string
      direction:
        description: above, below
        type: string
      id:
        type: string
      shares_qty:
        type: integer
      status:
        description: active, triggered, cancelled
        type: string
      trigger_price:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.SectorPerformance:
    properties:
      avg_change_percent:
        type: number
      company_count:
        type: integer
      sector:
        type: string
      total_market_cap:
        type: number
      total_turnover:
        type: number
      total_volume:
        type: integer
    type: object
  orderbook.OrderBookLevel:
    properties:
      orders:
        type: integer
      price:
        type: number
      quantity:
        type: integer
    type: object
  orderbook.OrderBookView:
    properties:
      asks:
        items:
          $ref: '#/definitions/orderbook.OrderBookLevel'
        type: array
      bids:
        items:
          $ref: '#/definitions/orderbook.OrderBookLevel'
        type: array
      company_id:
        type: string
    type: object
  orderbook.PlaceBuyOrderRequest:
    properties:
      company_id:
        type: string
      order_type:
        description: limit (default), market
        type: string
      price:
        type: string
      quantity:
        type: integer
    required:
    - company_id
    - price
    - quantity
    type: object
  orderbook.PlaceSellOrderRequest:
    properties:
      company_id:
        type: string
      price:
        type: string
      quantity:
        type: integer
    required:
    - company_id
    - price
    - quantity
    type: object
  wallet.TopUpRequest:
    properties:
      amount:
        type: string
    required:
    - amount
    type: object
  wallet.TransferRequest:
    properties:
      amount:
        type: string
      direction:
        description: main_to_trading, trading_to_main
        type: string
    required:
    - amount
    - direction
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Backend API for the Share Market Simulator with high-sensitivity price
    engine and order matching.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Share Market Simulator API
  version: "2.0"
paths:
  /admin/companies:
    post:
      consumes:
      - application/json
      description: Register a new company in the system
      parameters:
      - description: Company details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ipo.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a company (Admin only)
      tags:
      - admin
  /admin/ipos:
    post:
      consumes:
      - application/json
      description: Start an IPO for a specific company
      parameters:
      - description: IPO details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ipo.LaunchIPORequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Launch an IPO (Admin only)
      tags:
      - admin
  /admin/ipos/{id}/allocate:
    post:
      description: Trigger the lottery-based allocation for a closed IPO
      parameters:
      - description: IPO ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Allocate IPO shares (Admin only)
      tags:
      - admin
  /admin/users/{user_id}/kyc:
    put:
      consumes:
      - application/json
      description: Update KYC status and Role of a specific user
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: KYC and Role updates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateKYCAdmin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user KYC and Role (Admin only)
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - auth
  /auth/profile:
    get:
      description: Get current authenticated user profile (includes profile_image_url)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - auth
  /auth/profile/image:
    post:
      consumes:
      - multipart/form-data
      description: Upload profile image (max 5MB). Deletes old image from Supabase
        bucket and replaces with new one.
      parameters:
      - description: Profile image
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload profile image
      tags:
      - auth
  /auth/profile/update:
    put:
      consumes:
      - application/json
      description: Update current user's full name or phone
      parameters:
      - description: Profile updates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - auth
  /ipos:
    get:
      description: Get a list of all IPOs (active, closed, allocated)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List all IPOs
      tags:
      - ipo
  /ipos/{id}:
    get:
      description: Get details of a specific IPO by ID
      parameters:
      - description: IPO ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get IPO details
      tags:
      - ipo
  /ipos/{id}/apply:
    post:
      consumes:
      - application/json
      description: Apply for shares in an open IPO
      parameters:
      - description: IPO ID
        in: path
        name: id
        required: true
        type: string
      - description: Application details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ipo.ApplyIPORequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Apply for IPO
      tags:
      - ipo
  /market/candlestick:
    get:
      parameters:
      - description: Stock symbol
        in: query
        name: symbol
        required: true
        type: string
      - default: 1D
        description: Timeframe (1m, 5m, 15m, 1h, 1D)
        in: query
        name: timeframe
        type: string
      - default: 90
        description: Number of days
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CandlestickData'
            type: array
      summary: Get candlestick OHLCV data for a company
      tags:
      - Market
  /market/companies:
    get:
      parameters:
      - default: 50
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List all companies
      tags:
      - Market
  /market/companies/{company_id}/events:
    get:
      description: Get list of corporate events (AGM, dividend, etc.) for a specific
        company
      parameters:
      - description: Company ID
        in: path
        name: company_id
        required: true
        type: string
      - description: Limit (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get events for a company
      tags:
      - events
  /market/companies/{id}:
    get:
      parameters:
      - description: Company ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Company'
      summary: Get company detail
      tags:
      - Market
  /market/companies/new:
    get:
      parameters:
      - default: 10
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LiveTradingData'
            type: array
      summary: Get recently listed companies
      tags:
      - Market
  /market/companies/old:
    get:
      parameters:
      - default: 10
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LiveTradingData'
            type: array
      summary: Get oldest listed companies
      tags:
      - Market
  /market/events:
    get:
      description: Get list of all corporate events with pagination
      parameters:
      - description: Limit (default 50)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all events
      tags:
      - events
  /market/events/type/{type}:
    get:
      description: Get events filtered by event type (agm, dividend, bonus_share,
        etc.)
      parameters:
      - description: Event type
        in: path
        name: type
        required: true
        type: string
      - description: Limit (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get events by type
      tags:
      - events
  /market/events/upcoming:
    get:
      description: Get list of all upcoming corporate events across all companies
      parameters:
      - description: Limit (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get upcoming events
      tags:
      - events
  /market/index:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MarketIndex'
      summary: Get market index summary
      tags:
      - Market
  /market/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LiveTradingData'
            type: array
      summary: Get live trading data for all companies
      tags:
      - Market
  /market/most-active:
    get:
      parameters:
      - default: 10
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LiveTradingData'
            type: array
      summary: Get most actively traded stocks
      tags:
      - Market
  /market/sectors:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.SectorPerformance'
            type: array
      summary: Get sector performance summary
      tags:
      - Market
  /market/sectors/{sector}/companies:
    get:
      parameters:
      - description: Sector name
        in: path
        name: sector
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LiveTradingData'
            type: array
      summary: Get companies in a sector
      tags:
      - Market
  /market/stream:
    get:
      produces:
      - text/event-stream
      responses: {}
      summary: Stream live price updates (SSE)
      tags:
      - Market
  /market/top-gainers:
    get:
      parameters:
      - default: 10
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LiveTradingData'
            type: array
      summary: Get top gaining stocks
      tags:
      - Market
  /market/top-losers:
    get:
      parameters:
      - default: 10
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LiveTradingData'
            type: array
      summary: Get top losing stocks
      tags:
      - Market
  /market/top-turnover:
    get:
      parameters:
      - default: 10
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LiveTradingData'
            type: array
      summary: Get stocks with highest turnover
      tags:
      - Market
  /market/triggers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.PriceTrigger'
            type: array
      security:
      - BearerAuth: []
      summary: Get user's price triggers
      tags:
      - Triggers
    post:
      consumes:
      - application/json
      parameters:
      - description: Trigger request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.CreateTriggerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.PriceTrigger'
      security:
      - BearerAuth: []
      summary: Create a price trigger
      tags:
      - Triggers
  /market/triggers/{id}/cancel:
    put:
      parameters:
      - description: Trigger ID
        in: path
        name: id
