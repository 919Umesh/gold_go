basePath: /api/v1
definitions:
  api.CreateTriggerRequest:
    properties:
      company_id:
        type: string
      direction:
        description: above, below
        type: string
      shares_qty:
        type: integer
      trigger_price:
        type: string
    required:
    - company_id
    - direction
    - shares_qty
    - trigger_price
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.LoginResponse:
    properties:
      message:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 6
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
      role:
        maxLength: 10
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - phone
    - role
    type: object
  internal_auth.UpdateKYCAdmin:
    properties:
      kyc_status:
        enum:
        - pending
        - verified
        - rejected
        - under_review
        type: string
      role:
        enum:
        - user
        - admin
        type: string
    required:
    - kyc_status
    - role
    type: object
  internal_auth.UpdateProfileRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
    type: object
  internal_auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      kyc_status:
        type: string
      phone:
        type: string
      profile_image_id:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  internal_ipo.ApplyIPORequest:
    properties:
      shares_requested:
        type: integer
    required:
    - shares_requested
    type: object
  internal_ipo.CreateCompanyRequest:
    properties:
      name:
        type: string
      sector:
        type: string
      symbol:
        type: string
      total_supply:
        type: integer
    required:
    - name
    - symbol
    - total_supply
    type: object
  internal_ipo.LaunchIPORequest:
    properties:
      close_at:
        type: string
      company_id:
        type: string
      max_per_applicant:
        type: integer
      open_at:
        type: string
      price_per_share:
        type: string
      total_shares:
        type: integer
    required:
    - close_at
    - company_id
    - max_per_applicant
    - open_at
    - price_per_share
    - total_shares
    type: object
  internal_orderbook.OrderBookLevel:
    properties:
      orders:
        type: integer
      price:
        type: number
      quantity:
        type: integer
    type: object
  internal_orderbook.OrderBookView:
    properties:
      asks:
        items:
          $ref: '#/definitions/internal_orderbook.OrderBookLevel'
        type: array
      bids:
        items:
          $ref: '#/definitions/internal_orderbook.OrderBookLevel'
        type: array
      company_id:
        type: string
    type: object
  internal_orderbook.PlaceBuyOrderRequest:
    properties:
      company_id:
        type: string
      order_type:
        description: limit (default), market
        type: string
      price:
        type: string
      quantity:
        type: integer
    required:
    - company_id
    - price
    - quantity
    type: object
  internal_orderbook.PlaceSellOrderRequest:
    properties:
      company_id:
        type: string
      price:
        type: string
      quantity:
        type: integer
    required:
    - company_id
    - price
    - quantity
    type: object
  internal_wallet.TopUpRequest:
    properties:
      amount:
        type: string
    required:
    - amount
    type: object
  internal_wallet.TransferRequest:
    properties:
      amount:
        type: string
      direction:
        description: main_to_trading, trading_to_main
        type: string
    required:
    - amount
    - direction
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Backend API for the Share Market Simulator with high-sensitivity price
    engine and order matching.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Share Market Simulator API
  version: "2.0"
paths:
  /admin/companies:
    post:
      consumes:
      - application/json
      description: Register a new company in the system
      parameters:
      - description: Company details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_ipo.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a company (Admin only)
      tags:
      - admin
  /admin/ipos:
    post:
      consumes:
      - application/json
      description: Start an IPO for a specific company
      parameters:
      - description: IPO details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_ipo.LaunchIPORequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Launch an IPO (Admin only)
      tags:
      - admin
  /admin/ipos/{id}/allocate:
    post:
      description: Trigger the lottery-based allocation for a closed IPO
      parameters:
      - description: IPO ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Allocate IPO shares (Admin only)
      tags:
      - admin
  /admin/users/{user_id}/kyc:
    put:
      consumes:
      - application/json
      description: Update KYC status and Role of a specific user
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: KYC and Role updates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdateKYCAdmin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user KYC and Role (Admin only)
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - auth
  /auth/profile:
    get:
      consumes:
      - application/json
      description: Get current authenticated user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - auth
  /auth/profile/image:
    post:
      consumes:
      - multipart/form-data
      description: Upload profile image for current user (max 5MB)
      parameters:
      - description: Profile image
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload profile image
      tags:
      - auth
  /auth/profile/update:
    put:
      consumes:
      - application/json
      description: Update current user's full name or phone
      parameters:
      - description: Profile updates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - auth
  /ipos:
    get:
      description: Get a list of all IPOs (active, closed, allocated)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List all IPOs
      tags:
      - ipo
  /ipos/{id}:
    get:
      description: Get details of a specific IPO by ID
      parameters:
      - description: IPO ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get IPO details
      tags:
      - ipo
  /ipos/{id}/apply:
    post:
      consumes:
      - application/json
      description: Apply for shares in an open IPO
      parameters:
      - description: IPO ID
        in: path
        name: id
        required: true
        type: string
      - description: Application details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_ipo.ApplyIPORequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Apply for IPO
      tags:
      - ipo
  /market/companies:
    get:
      description: Get a list of all trading companies with summary data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List companies
      tags:
      - market
  /market/companies/{symbol}:
    get:
      description: Get detailed info for a specific company by symbol
      parameters:
      - description: Company Symbol
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get company details
      tags:
      - market
  /market/companies/{symbol}/candles:
    get:
      description: Get OHLCV data for a specific symbol
      parameters:
      - description: Company Symbol
        in: path
        name: symbol
        required: true
        type: string
      - description: Timeframe (default 1D)
        in: query
        name: timeframe
        type: string
      - description: Number of days (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Get candlestick data
      tags:
      - market
  /market/index:
    get:
      description: Get overall market indicators (advances, declines, market cap)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get market index
      tags:
      - market
  /market/live:
    get:
      description: Get live price and volume data for all companies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get live trading data
      tags:
      - market
  /market/stream:
    get:
      description: Real-time price updates via Server-Sent Events
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
      summary: Stream prices (SSE)
      tags:
      - market
  /orderbook/{company_id}:
    get:
      description: Get current buy and sell orders for a specific company
      parameters:
      - description: Company ID
        in: path
        name: company_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orderbook.OrderBookView'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get company order book
      tags:
      - market
  /orders/{id}:
    delete:
      description: Cancel an open buy or sell order
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancel an order
      tags:
      - trading
  /orders/buy:
    post:
      consumes:
      - application/json
      description: Place a new buy limit or market order
      parameters:
      - description: Buy order details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_orderbook.PlaceBuyOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Place a buy order
      tags:
      - trading
  /orders/my:
    get:
      description: Get a list of open and historical orders for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user's orders
      tags:
      - trading
  /orders/sell:
    post:
      consumes:
      - application/json
      description: Place a new sell limit order
      parameters:
      - description: Sell order details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_orderbook.PlaceSellOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Place a sell order
      tags:
      - trading
  /portfolio:
    get:
      description: Get a list of all stock holdings for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user portfolio
      tags:
      - trading
  /trades:
    get:
      description: Get a list of all executed trades for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user's trades
      tags:
      - trading
  /triggers:
    get:
      description: Get a list of active price triggers for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user's triggers
      tags:
      - trading
    post:
      consumes:
      - application/json
      description: Create an auto-sell trigger based on price target
      parameters:
      - description: Trigger details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateTriggerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create price trigger
      tags:
      - trading
  /triggers/{id}:
    delete:
      description: Cancel an active price trigger
      parameters:
      - description: Trigger ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancel price trigger
      tags:
      - trading
  /wallet:
    get:
      description: Get current user's main and trading wallets
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get both wallets
      tags:
      - wallet
  /wallet/main:
    get:
      description: Get current user's main wallet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get main wallet
      tags:
      - wallet
  /wallet/topup:
    post:
      consumes:
      - application/json
      description: Add funds to the user's main wallet
      parameters:
      - description: Top up details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_wallet.TopUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Top up main wallet
      tags:
      - wallet
  /wallet/trading:
    get:
      description: Get current user's trading wallet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get trading wallet
      tags:
      - wallet
  /wallet/transfer:
    post:
      consumes:
      - application/json
      description: Transfer funds between main wallet and trading wallet
      parameters:
      - description: Transfer details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_wallet.TransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
