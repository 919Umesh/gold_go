services:
  # Go Backend Service
  - type: web
    name: gold-go-backend
    runtime: docker
    region: frankfurt  # Change to your preferred region: oregon, frankfurt, singapore, etc.
    plan: free  # Change to 'starter' or higher for production
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    healthCheckProtocol: http
    envVars:
      # Server Configuration
      - key: PORT
        value: 8080
      
      # Appwrite Configuration (Cloud)
      - key: APPWRITE_ENDPOINT
        value: https://fra.cloud.appwrite.io/v1
      
      - key: APPWRITE_PROJECT_ID
        value: 698599a4000fcd54a56a
      
      - key: APPWRITE_API_KEY
        sync: false  # Set this in Render  for security
      
      - key: APPWRITE_DATABASE_ID
        value: 6985bccb00216e0a7171
      
      # Worker Configuration
      - key: WORKER_COUNT
        value: 5
      
      - key: QUEUE_SIZE
        value: 100
      
      # JWT Secret (Set in Render dashboard)
      - key: JWT_SECRET
        generateValue: true  # Render will auto-generate a secure value
      
      # Gold Provider URL (if applicable)
      - key: GOLD_PROVIDER_URL
        value: https://api.goldprovider.com  # Update with your actual provider
    
    healthCheckPath: /health  # Add a health endpoint to your API
    
    autoDeploy: true  # Auto-deploy on push to main branch

