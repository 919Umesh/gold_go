services:
  # Go Backend Service
  - type: web
    name: gold-go-backend
    runtime: docker
    region: frankfurt  # Change to your preferred region: oregon, frankfurt, singapore, etc.
    plan: free  # Change to 'starter' or higher for production
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Server Configuration
      - key: PORT
        value: 8080
      
      # Supabase Configuration
      - key: SUPABASE_URL
        sync: false  # Set this in Render dashboard
      
      - key: SUPABASE_ANON_KEY
        sync: false  # Set this in Render dashboard for security
      
      # Worker Configuration
      - key: WORKER_COUNT
        value: 5
      
      - key: QUEUE_SIZE
        value: 100
      
      # JWT Secret (Set in Render dashboard)
      - key: JWT_SECRET
        generateValue: true  # Render will auto-generate a secure value
      
      # Gold Provider URL (if applicable)
      - key: GOLD_PROVIDER_URL
        value: https://api.goldprovider.com  # Update with your actual provider
    
    autoDeploy: true  # Auto-deploy on push to main branch

